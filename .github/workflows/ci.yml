name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkpay
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: linkpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkpay -d linkpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: apps/api/go.sum
      - name: Go tests and vet
        working-directory: apps/api
        env:
          LINKPAY_TEST_DATABASE_URL: postgres://linkpay:ci-only-password@localhost:5432/linkpay?sslmode=disable
        run: |
          go test ./...
          go vet ./...
      - name: Go vulnerability scan
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Frontend lint and build
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run format:check
          npm run lint
          npm run build
      - name: Compose configuration
        env:
          POSTGRES_USER: linkpay
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: linkpay
          DATABASE_URL: postgres://linkpay:ci-only-placeholder@db:5432/linkpay?sslmode=disable
          PUBLIC_TOKEN_SECRET: ci-only-placeholder-with-at-least-32-characters
        run: |
          docker compose config --quiet
          docker compose --profile production config --quiet
      - name: Docker build
        run: |
          docker build -f deployments/Dockerfile .
          docker build -f apps/web/Dockerfile .
